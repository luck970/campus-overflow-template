# CampusOverflow 本地依赖：MySQL 8 + Redis 7。
# 用法：docker compose up -d；表结构由应用启动时 Flyway 自动创建，无需手动建库建表。
# 停止并保留数据：docker compose stop；彻底清理：docker compose down -v。
services:
  mysql:
    image: mysql:8.0.39
    container_name: co-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: campus_overflow
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus_dev_pwd
      MYSQL_ROOT_PASSWORD: root_pwd
    ports:
      - "3306:3306"
    volumes:
      - co-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucampus", "-pcampus_dev_pwd"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: co-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - co-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  co-mysql-data:
  co-redis-data:
